version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: chepetime-maintainerr_server_1
      APP_PORT: 6246

  server:
    # Upstream moved the package from jorenn92/maintainerr to the org path;
    # both resolve to the same digest today. Multi-arch index digest.
    image: ghcr.io/maintainerr/maintainerr:3.25.0@sha256:f96e37e04a5e2da56edc39d96774102599de7d7617e2cc00a49a1581b01be136
    # Upstream requires /opt/data to be writable by this uid, and Umbrel
    # creates app data as 1000:1000, so the two already agree.
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data:/opt/data
      # The leftover-folder cleanup rules compare against library paths as
      # Radarr and Sonarr report them, so Maintainerr has to see the same
      # tree at the same path. Umbrel's *arr apps mount this as /downloads.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
      - /etc/localtime:/etc/localtime:ro
    restart: on-failure
