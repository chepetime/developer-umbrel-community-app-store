releaseNotes: >-
  Adds a safe administrator workspace reset for replacing existing invoice
  data with a complete backup. The reset removes invoices, sender profiles,
  bank accounts, clients, monthly tax periods, and uploaded file contents so
  the next restore starts from a genuinely empty workspace.


  The Billow account, password, sessions, recovery-key setup, API keys, and
  installation ownership are preserved, so the administrator stays signed in
  and can restore immediately afterward.


  The operation requires an explicit destructive confirmation, is restricted
  to administrators, and scopes every database and file deletion to the
  signed-in user.


