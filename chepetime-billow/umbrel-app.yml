releaseNotes: >-
  Restoring a backup now refuses to run onto a workspace that still holds
  invoices, and says what is in the way. Restore creates records rather than
  matching existing ones, so running it over data that is already there left
  two of every sender profile, bank account and client, with invoices split
  between the copies. The workspace reset is the step that belongs first, and
  this makes it the path rather than a suggestion.


  Invoices can now be edited over the API. A read returns the sender profile,
  bank account and client it points at, which an update requires and previous
  versions never returned - so an invoice could be read but not written back,
  and two similar bank accounts were impossible to tell apart.


  Sender profiles and bank accounts can be deleted over the API. Creating and
  updating them stays in the browser, where the encryption key lives, but a
  delete writes no encrypted field and is refused anyway while any invoice
  still refers to the record.

