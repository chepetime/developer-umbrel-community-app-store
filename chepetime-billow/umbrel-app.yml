description: >-
  Billow writes invoices, prints them to PDF, and then keeps track of what
  happens to each one afterwards - sent, received, paid, turned into a CFDI by
  your accountant, and included in a filed monthly tax report.


  Writing the invoice is the short part of the job. Knowing months later which
  ones are still unfinished is the long part, and that is what Billow is for.


  Senders, bank accounts and clients are all editable, and an invoice can be
  duplicated into next month's in one click. Bank details are encrypted at
  rest with a key only your password opens.


  Built with Next.js App Router and React Server Components, Prisma on
  PostgreSQL, better-auth and Tailwind, shipped as a single multi-architecture
  Docker image. It carries a full platform underneath: accounts with email or
  username sign-in, TOTP two-factor, personal API keys, admin roles, database
  migrations applied on start, backup and restore, file uploads, health checks
  and an error log.

