releaseNotes: >-
  Fixes a bug that made it impossible to add anyone else to an installation.
  Creating a second account failed with "Unable to create the account" and
  always had - only the very first account, the one that owns the install,
  could ever be created. If you tried to add someone and gave up, it was
  this, and it was not anything you did.


  The cause was a safeguard that decides which of several simultaneous
  sign-ups becomes the owner. It recognised the losing sign-up by an identity
  check that quietly stops working once the app is compiled for production,
  so instead of stepping aside, the second account errored out. It went
  unseen because the check behaves correctly everywhere except in the built
  image.


  Also in this release: the end-to-end test suite that should have caught it
  now runs clean, including the file-upload tests, which had been failing for
  a permissions reason of their own.

