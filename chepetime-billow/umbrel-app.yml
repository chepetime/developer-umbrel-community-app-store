releaseNotes: >-
  Billow now has a REST API for the whole workspace. Invoices, clients and
  monthly tax periods can be read and written from a script or another
  service, and a new income endpoint reports a full year at once - what was
  invoiced and what was paid, month by month, with each month's CFDI count and
  the state of its tax filing.


  Those figures are grouped by currency and never added together across
  currencies. An invoice billed in dollars is not worth its face value in
  pesos, and Billow stores no exchange rate to convert it, so anything that
  needs a single number has to supply its own rate.


  API keys now carry a scope, and new keys are read-only by default. A key left
  running in a script can summarise the workspace without being able to delete
  an invoice; read and write is a deliberate choice made when the key is
  created. Keys created before this update keep the access they already had.


  Rate limiting is fixed. A throttled request used to answer 401, which told
  callers their key was invalid and sent them off to replace a key that was
  working fine. It now answers 429 with a Retry-After header saying how long to
  wait. The allowance was also far too small at ten requests a day, and is now
  120 a minute.


  The files list can finally show the documents attached to invoices and tax
  filings. They always counted against the storage quota but appeared nowhere,
  which made the quota look wrong.

