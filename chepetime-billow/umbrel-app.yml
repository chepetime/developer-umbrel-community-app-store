releaseNotes: >-
  Printing an invoice now offers a real filename. Every browser seeds the
  print-to-PDF name from the page title, and the invoice page had none worth
  using, so each saved invoice arrived as some variation of the app name and
  had to be renamed by hand. It now prints as
  Invoice-12-Your_Legal_Name-2026-08-31, with accents folded and the date
  taken from the invoice's own day rather than a timezone-shifted one.


  Every other page names itself too, so browser tabs, history and bookmarks
  say which invoice, client or bank account is open instead of all reading
  "Billow".


  An invoice scheduled to go out later is no longer described as sent.
  Recording a future send date is how an invoice gets queued here, but the
  status was derived from whether that date existed rather than whether it had
  arrived, so a future invoice showed as Sent and the dashboard asked for
  client approval that could not have happened yet. It now reads Scheduled,
  and stays out of the attention list until its date comes around.

