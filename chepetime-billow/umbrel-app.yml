releaseNotes: >-
  Invoices now have opaque, non-sequential IDs and a complete workflow for
  recording when they were sent, approved, paid, converted into a CFDI,
  included in a monthly tax filing, and finished. Progress can be corrected
  if a status or date was entered by mistake.


  CFDI records can include both the XML and PDF delivered by the accountant.
  Monthly tax filings can record the filing date, amount paid, payment date,
  and payment confirmation file, including images.


  The invoice detail page has been redesigned around the workflow, with clear
  next actions, editable milestones, and pointer feedback on interactive
  controls.


  Backup format 3 now carries lifecycle and tax records together with their
  uploaded file contents, allowing current local data to be restored into
  Umbrel after this update. Local development uploads also default to a
  persistent directory inside the repository.


