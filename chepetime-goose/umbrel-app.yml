manifestVersion: 1
id: chepetime-goose
storage:
  dataRoot: data
name: Goose
tagline: A self-hosted app with the boring parts already built
icon: https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/chepetime-goose/icon.svg
category: Development
version: "0.1.0-4"
port: 46248
description: >-
  A base setup for self-hosted apps. The parts every such app needs are already
  built and tested: accounts with email or username sign-in, TOTP two-factor,
  personal API keys, admin roles, database migrations applied on start, backup
  and restore, file uploads, health checks and an error log.


  Built with Next.js App Router and React Server Components, Prisma on
  PostgreSQL, better-auth, Tailwind and shadcn/ui, shipped as a single
  multi-architecture Docker image.


  It comes with a small invoicing workspace. That is a worked example of the
  platform rather than the point - a real domain wired through the same auth,
  validation, backup and API conventions, there to be replaced by your own.

developer: ChepeTime
website: https://github.com/chepetime/umbrel-goose
submitter: ChepeTime
submission: https://github.com/chepetime/developer-umbrel-community-app-store
repo: https://github.com/chepetime/umbrel-goose
support: https://github.com/chepetime/umbrel-goose/issues
# Required, not optional: umbreld's manifest schema declares
# `gallery: z.array(z.string())` with no `.optional()`, unlike every other
# field that can be left out. Omitting it fails Zod validation and umbreld
# drops the app from the store silently — no error, the app simply never
# appears. An empty array also validates, if these are ever removed.
#
# These are currently Billow's screenshots, copied rather than linked so
# replacing them here is a drop-in. They show Billow's name in the UI until
# Goose's own captures replace them.
gallery:
  - https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/chepetime-goose/gallery/1-home.jpg
  - https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/chepetime-goose/gallery/2-account.jpg
  - https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/chepetime-goose/gallery/3-api-keys.jpg
releaseNotes: >-
  Moves this app's data into the data/ folder of its app directory, which is
  the folder umbrelOS 2.0 storage management can relocate to another drive.
  Existing installs are moved automatically the first time the app starts
  after this update. Nothing is reset or re-downloaded, and on current
  umbrelOS versions nothing else changes.

dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
