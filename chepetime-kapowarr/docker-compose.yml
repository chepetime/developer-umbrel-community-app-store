version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: chepetime-kapowarr_server_1
      APP_PORT: 5656

  server:
    # Multi-arch index digest (amd64, arm64).
    image: mrcas/kapowarr:v1.3.2@sha256:cd3f004caff59636dde73b06df5b2f8068b485b47ff5fe82f6129562c0f2ac3b
    environment:
      # Upstream's docs default to PUID/PGID 0, i.e. root. Umbrel creates app
      # data as 1000:1000 and the shared storage is owned the same way, so
      # 1000 both works and keeps new comic files consistent with what the
      # *arr apps write.
      PUID: 1000
      PGID: 1000
    volumes:
      - ${APP_DATA_DIR}/db:/app/db
      # Comics library and the in-progress download folder, both on Umbrel's
      # shared storage so files land beside everything else and can be moved
      # without crossing a filesystem boundary.
      - ${UMBREL_ROOT}/data/storage/downloads/comics:/comics
      - ${UMBREL_ROOT}/data/storage/downloads/kapowarr-incomplete:/app/temp_downloads
      - /etc/localtime:/etc/localtime:ro
    restart: on-failure
