manifestVersion: 1
id: chepetime-kapowarr
storage:
  dataRoot: data
name: Kapowarr
tagline: The *arr for comics — build, organise and complete your collection
icon: https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/chepetime-kapowarr/icon.svg
category: media
version: "1.3.2-1"
port: 46253
description: >-
  Kapowarr manages a comic book library the way Radarr and Sonarr manage film
  and television. You add volumes, it builds the issue list from ComicVine,
  shows you what is missing, and searches for it.


  Files are renamed and filed to a naming convention you choose, converted
  between formats where you want that, and monitored so new issues are picked
  up as they are released.


  It works with Direct Download, Mega and torrent clients, and keeps a full
  history of what it fetched and from where.


  You will need a free ComicVine API key before it can identify anything —
  set it in Settings on first run.


  The comics library is mounted from Umbrel's shared storage at
  downloads/comics, so it sits beside everything the *arr apps manage.
developer: Casvt
website: https://casvt.github.io/Kapowarr
submitter: ChepeTime
submission: https://github.com/chepetime/developer-umbrel-community-app-store
repo: https://github.com/Casvt/Kapowarr
support: https://github.com/Casvt/Kapowarr/issues
gallery: []
releaseNotes: >-
  Moves this app's data into the data/ folder of its app directory, which is
  the folder umbrelOS 2.0 storage management can relocate to another drive.
  Existing installs are moved automatically the first time the app starts
  after this update. Nothing is reset or re-downloaded, and on current
  umbrelOS versions nothing else changes.

dependencies: []
permissions:
  - STORAGE_DOWNLOADS
path: ""
defaultUsername: ""
defaultPassword: ""
