# Gateway in front of Multica's two HTTP services.
#
# Umbrel's app_proxy can only forward to a single APP_HOST/APP_PORT, and
# Multica needs two: the Next.js frontend serves the UI and proxies /api,
# /auth and /uploads to the Go backend through its own rewrites — but Next.js
# rewrites forward HTTP only, never the `Upgrade` handshake a WebSocket needs.
# So this file sends the two WebSocket endpoints straight to the backend and
# leaves everything else on upstream's tested path through Next.js.
#
# Mounted read-only from ${APP_DATA_DIR}/nginx.conf; umbreld rsyncs the whole
# app directory into app-data on install (apps.ts: `rsync --archive`).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. proxy_pass targets are held in variables so nginx
    # re-resolves them at request time; with a literal name it resolves once at
    # startup and keeps a stale IP after a container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Attachments. The backend caps uploads itself; this only stops nginx from
    # rejecting them first with a 413.
    client_max_body_size 100m;

    # Fully-qualified container names (<app-id>_<service>_1). Every Umbrel app
    # shares umbrel_main_network, so a bare `backend` or `frontend` alias
    # resolves to other apps' containers too — and the published web image
    # bakes in REMOTE_API_URL=http://backend:8080, which is exactly that trap.
    set $multica_backend  "chepetime-multica_backend_1:8080";
    set $multica_frontend "chepetime-multica_frontend_1:3000";

    # Browser realtime channel: chat streaming, live issue updates,
    # notifications. The backend checks the WebSocket Origin against r.Host, so
    # $http_host has to be passed through with its port intact — $host would
    # strip the port and every upgrade would be rejected.
    location = /ws {
        proxy_pass http://$multica_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # The agent daemon on the user's own machine connects here. It lives under
    # /api, so without this exact-match location it would fall through to the
    # frontend and the upgrade would be dropped by the Next.js rewrite.
    location = /api/daemon/ws {
        proxy_pass http://$multica_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Liveness and readiness. Backend routes that Next.js does not rewrite —
    # its rewrite list is /api, /auth, /uploads and /ws only — so without
    # these two the frontend answers 404. `multica setup self-host` probes
    # GET <server-url>/health and requires 200 (cmd_setup.go probeServer), so
    # a 404 here is reported to the user as "Server is not reachable", which
    # sends you hunting a network problem that does not exist.
    location = /health {
        proxy_pass http://$multica_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://$multica_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else, including /api, /auth and /uploads. Those are left to
    # the Next.js rewrites on purpose: they are `afterFiles` rewrites, so real
    # pages such as /auth/callback win over the proxy. Routing /auth/* here
    # would break Google sign-in.
    location / {
        proxy_pass http://$multica_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Next.js streams App Router responses; buffering them here makes the
        # UI appear to hang until the whole page is ready.
        proxy_buffering off;
        proxy_read_timeout 300;
    }
}
