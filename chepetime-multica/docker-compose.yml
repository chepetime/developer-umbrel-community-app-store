version: "3.7"

services:
  app_proxy:
    environment:
      # The gateway, not the frontend: Multica needs two upstreams and
      # app_proxy only forwards to one. See nginx.conf.
      APP_HOST: chepetime-multica_gateway_1
      APP_PORT: 80
      # The multica CLI and the agent daemon run on your own machine and
      # authenticate with a `mul_` personal access token over
      # Authorization: Bearer. They have no Umbrel session cookie, so every
      # call would be bounced by Umbrel's login without this. /api/daemon/ws
      # is the daemon's WebSocket; /ws is the browser's.
      #
      # The cost: the whole API is reachable from the LAN without Umbrel auth,
      # protected only by Multica's own tokens and login. That is real auth —
      # every route outside /api/auth requires it — but it is a smaller wall
      # than Umbrel's. The UI itself stays behind Umbrel's login.
      # /health is here because `multica setup self-host` probes it before it
      # will write any config, and app_proxy would otherwise answer the CLI
      # with a redirect to Umbrel's login — reported as "Server is not
      # reachable", which reads like a network fault rather than an auth wall.
      PROXY_AUTH_WHITELIST: "/api/*,/ws,/health"

  gateway:
    image: nginx:1.31-alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    depends_on:
      - frontend
      - backend
    volumes:
      # In hooks/ rather than beside the manifest, and that is load-bearing.
      # A fresh install rsyncs the whole app directory into app-data, but an
      # *update* copies only a whitelist (app-script, `pre-patch-update`):
      #
      #   docker-compose.yml *.template exports.sh torrc hooks
      #
      # A plain nginx.conf therefore installs correctly and then never
      # changes again — every later fix to it would need an uninstall, which
      # deletes app-data and the database with it. `hooks` is a directory in
      # that whitelist and `cp --archive` merges it over the existing one, so
      # a file parked here does move with updates. `*.template` is not an
      # option: template_app runs plain envsubst, which would blank every
      # nginx variable ($http_upgrade, $request_uri, …). Nothing executes
      # this file — execute_hook only runs specific hook names, and only if
      # they are executable.
      - ${APP_DATA_DIR}/hooks/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
    restart: on-failure

  frontend:
    # Multi-arch index digest (amd64, arm64).
    image: ghcr.io/multica-ai/multica-web:v0.4.32@sha256:c6976fbee1b1c566543067cde544d3168d3f9b71c60e6a5ccb7f2851392e8234
    depends_on:
      - backend
    environment:
      HOSTNAME: "0.0.0.0"
      # MUST be overridden. Dockerfile.web bakes in
      # REMOTE_API_URL=http://backend:8080, and on Umbrel's shared network the
      # bare name `backend` also resolves to other apps' containers.
      REMOTE_API_URL: http://chepetime-multica_backend_1:8080
      # Left empty on purpose: the browser then calls /api and /ws on the
      # page's own origin, so cookies stay host-only and no CORS or
      # cross-host CSRF problem can arise. NEXT_PUBLIC_WS_URL is a build-time
      # variable anyway — setting it here would do nothing.
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
    restart: on-failure

  backend:
    # Multi-arch index digest (amd64, arm64).
    image: ghcr.io/multica-ai/multica-backend:v0.4.32@sha256:508de17e1ddb335a5a3907a2a7702f2a20e7cf4a9321f63ee7a2bcdfef57ee35
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Fully-qualified container name, not `postgres`: several Umbrel apps
      # ship a service by that name on the same network.
      DATABASE_URL: postgres://multica:${APP_PASSWORD}@chepetime-multica_postgres_1:5432/multica?sslmode=disable
      PORT: "8080"
      APP_ENV: production
      # Turns the per-IP rate limiter on. Without it the server logs
      # "rate limiting disabled: REDIS_URL not configured" and POST
      # /auth/verify-code is unlimited — a six-digit login code with a ten
      # minute lifetime is brute-forceable in that state, and this API is
      # reachable from the internet through a tunnel. Also backs the daemon
      # token and empty-claim caches, which otherwise hit Postgres directly.
      #
      # Deliberately NOT setting RATE_LIMIT_TRUSTED_PROXIES. Unset, the
      # limiter keys on RemoteAddr, which behind this gateway is one address
      # for everybody — so the limits are global rather than per client. That
      # is the safe direction: honouring X-Forwarded-For here would let a
      # caller pick their own bucket by forging the header and bypass the
      # limit entirely. The cost is that one abusive client can lock others
      # out of login for a minute.
      REDIS_URL: redis://:${APP_PASSWORD}@chepetime-multica_redis_1:6379
      # Signs session JWTs. APP_SEED is Umbrel's per-install secret — 64 hex
      # characters, unique to this machine, never published. Without it the
      # server falls back to a hardcoded default and logs a warning.
      JWT_SECRET: ${APP_SEED}
      # NOTE: FRONTEND_ORIGIN, MULTICA_APP_URL, CORS_ALLOWED_ORIGINS and
      # MULTICA_PUBLIC_URL are deliberately NOT set here. They name the
      # address this install is actually reached at, which differs per host
      # and is often a private domain that must not be published. Declaring
      # them here would also make them unoverridable: `environment` silently
      # beats env_file, so a value in secrets.env would be ignored. They
      # belong in secrets.env — see env_file below.
      #
      # Leaving them unset is safe for the paths that resolve per request:
      # the gateway forwards $http_host and MULTICA_TRUSTED_PROXIES lets the
      # backend trust X-Forwarded-Host, so the WebSocket origin check passes
      # on whatever hostname the browser used, and cookies stay non-Secure so
      # they work over plain http. What does NOT work unset is anything that
      # needs an absolute URL from config: invitation email links, the daemon
      # setup command shown in the UI, and autopilot webhook URLs.
      #
      # umbrel_main_network. Lets the backend trust X-Forwarded-Host from the
      # gateway, so a browser arriving on any hostname that reaches this box
      # is treated as same-origin without being listed above.
      MULTICA_TRUSTED_PROXIES: 10.21.0.0/16
      # Self-hosted Git providers (Forgejo, Gitea, GitLab). The feature stays
      # off until MULTICA_VCS_SECRET_KEY is set, and that key must be exactly
      # 32 bytes base64-encoded (`openssl rand -base64 32`), which cannot be
      # derived from APP_SEED here. Put it in secrets.env — see env_file
      # below. GitHub does not need it.
      MULTICA_VCS_INTEGRATION_ENABLED: "true"
    # Optional, user-managed, never in this repo. The only place secrets and
    # per-host settings can live and survive: it is not in the app template,
    # so a fresh install's rsync never touches it, and not in the update
    # whitelist, so an update cannot overwrite it either. `required: false`
    # means the app still starts when the file does not exist (compose 2.24+;
    # the host runs v5.3.1).
    #
    # Anything set here must NOT also appear under `environment:` above —
    # environment wins over env_file, silently. That is why SMTP_HOST and
    # RESEND_API_KEY are no longer declared there as empty strings.
    #
    #   ssh umbrel
    #   umask 077
    #   cd ~/umbrel/app-data/chepetime-multica
    #   printf 'MULTICA_VCS_SECRET_KEY=%s\n' "$(openssl rand -base64 32)" > secrets.env
    #   umbreld client apps.restart.mutate --appId chepetime-multica
    #
    # Useful keys: FRONTEND_ORIGIN, MULTICA_APP_URL, CORS_ALLOWED_ORIGINS and
    # MULTICA_PUBLIC_URL (the address this install is reached at — see the
    # note in `environment` above), MULTICA_VCS_SECRET_KEY (self-hosted Git
    # providers), SMTP_HOST/SMTP_PORT/SMTP_USERNAME/SMTP_PASSWORD/SMTP_TLS or
    # RESEND_API_KEY + RESEND_FROM_EMAIL (real login emails instead of codes
    # in the log), ALLOW_SIGNUP=false (close signup once your account exists).
    env_file:
      - path: ${APP_DATA_DIR}/secrets.env
        required: false
    volumes:
      # Attachments and avatars. The container filesystem is replaced on every
      # update, so this has to be a mount to survive.
      - ${APP_DATA_DIR}/uploads:/app/data/uploads
      - /etc/localtime:/etc/localtime:ro
    restart: on-failure

  redis:
    # Multi-arch index digest (amd64, arm64, armv6, armv7).
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    # Password-protected because every Umbrel app shares one Docker network,
    # so an open Redis here is readable and writable by any other installed
    # app. APP_PASSWORD is derived per install and is hex, so it needs no
    # escaping inside the redis:// URL above.
    #
    # Persistence is off: this holds rate-limit counters and short-lived
    # caches, all of which are correct to lose on restart. Without --save ""
    # the image would also try to write RDB snapshots into a volume that
    # deliberately does not exist.
    command:
      - redis-server
      - --requirepass
      - ${APP_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      # redis-cli reads this, so the healthcheck below does not have to put
      # the password on a command line visible in `docker inspect`.
      REDISCLI_AUTH: ${APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  postgres:
    # pgvector, not plain postgres: Multica stores embeddings and the
    # migrations create a vector extension.
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    # Postgres needs time to flush and shut down cleanly when Umbrel stops the
    # app; the default 10s can leave the data directory needing recovery.
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: multica
      # Every Umbrel app shares one Docker network, so a password committed to
      # a public repository would let any other installed app read this
      # database. APP_PASSWORD is derived per install and never published.
      # It is a different value from APP_SEED above on purpose.
      POSTGRES_PASSWORD: ${APP_PASSWORD}
    volumes:
      # 18+ changed what the official postgres image expects here (see
      # docker-library/postgres#1259): a mount landing directly on
      # /var/lib/postgresql/data is now treated as leftover pre-18 state and
      # refuses to start ("these Docker images are configured to store
      # database data in a format which is compatible with pg_ctlcluster"),
      # even on a first boot with nothing in it. 18+ wants a single mount at
      # the parent /var/lib/postgresql instead, and places data itself in a
      # version-named subdirectory below it (enables pg_upgrade --link
      # later). Do not set PGDATA to route around this — that just trades
      # one hardcoded path for another that breaks the next major again;
      # mounting the parent is upstream's actual fix.
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multica -d multica"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure
