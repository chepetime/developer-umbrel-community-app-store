description: >-
  Multica is an issue tracker whose assignees can be AI coding agents. You
  write an issue the way you would for a person, assign it to an agent, and it
  picks up the task, works on it, reports progress in the comments and opens a
  pull request for review. Every run keeps its full execution log and token
  cost, so you can see what the agent actually did rather than trusting a
  summary.


  It speaks to twenty agent CLIs, including Claude Code, Codex, Cursor Agent,
  GitHub Copilot CLI, Gemini's Antigravity, Qwen Code and Grok. Around that
  sits the ordinary project-management surface: projects, squads, labels,
  custom properties, saved views, and autopilots that trigger a run from a
  webhook or a schedule.


  Read this before installing — this app is only half of Multica. It runs the
  server: the database, the API and the web UI. The part that actually runs
  the agents, the daemon, has to run on the machine where your code and your
  agent CLIs live, which is not this Umbrel. You install the multica CLI there
  and point it at this server. Nothing happens on an assigned issue until that
  daemon is connected, so an install on its own does nothing.


  Also note that no email is configured, and Multica logs you in with a code
  sent by email. Without a mail backend that code is printed to the backend
  container's log, so the first sign-in needs SSH access to this Umbrel to
  read it. The README beside this app has the command.


