releaseNotes: >-
  Billow now describes itself as what it actually is: a base setup for building
  self-hosted apps, rather than an invoicing app. The landing page, README and
  documentation now lead with the stack and with what the platform gives you -
  accounts, two-factor, an API, migrations, backups, an image and a release
  pipeline.


  The invoicing workspace is unchanged and still there. It is now presented as
  a worked example of the platform, meant to be replaced by whatever you want
  to build, rather than as the product.


  No schema changes and no migration. Updates in place; no reinstall needed.


