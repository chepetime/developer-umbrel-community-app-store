releaseNotes: >-
  Security hardening: browser security headers including a content security
  policy, rate limiting on sign-in and two-factor verification, and retention
  for the internal error log so it no longer grows without bound.


  Updates in place from 0.1.25; no reinstall needed.


  This release changes the database password, which Postgres only applies to a
  fresh data directory. Uninstall and reinstall Billow rather than updating in
  place, or the app will not be able to connect.
