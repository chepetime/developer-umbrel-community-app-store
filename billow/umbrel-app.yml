releaseNotes: >-
  Backups now include your uploaded files, not just your invoices, clients and
  bank details. Previously a restore reported success and quietly came back
  without any attachments — the export simply did not carry them.


  The backup is now a single .tar.gz archive rather than a .json file. It is a
  standard archive, so you can open it with any unzip tool and read your data
  without Billow. Restores check every file against the backup's own checksums
  and tell you about anything they could not restore instead of skipping it
  silently.


  Backups taken with earlier versions still restore normally.


  Updates in place; no reinstall needed.


