releaseNotes: >-
  Email and password reset. An administrator adds a Resend API key and sender
  address under Settings → Administration, sends a test message to confirm
  delivery, and a "Forgot your password?" link then appears on the sign-in
  page. Until that test message actually arrives the link stays hidden, so it
  is never offered on an installation where it could not work. The API key is
  stored encrypted and never shown again.


  Also in this release: password resets sign out any other active sessions,
  sign-in and reset requests are rate limited, and the container now runs with
  a correctly configured group.


  Updates in place; no reinstall needed.
