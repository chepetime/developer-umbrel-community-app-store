releaseNotes: >-
  The download is less than half the size it was — roughly 140 MB instead of
  326 MB — so updates apply considerably faster. The image now ships only the
  server and the files it actually reaches, rather than a full install of every
  dependency.


  Billow also runs on ARM now. Images are published for both 64-bit Intel/AMD
  and ARM, so it installs on a Raspberry Pi, which previous versions could not
  do at all.


  This release also starts the container as the user Umbrel creates app data
  with, so it no longer briefly runs as root to correct file ownership on
  every boot.


  Updates in place; no reinstall needed.


