releaseNotes: >-
  Settings → Security now lists every device signed in to your account, with
  where and when it signed in, and lets you sign any of them out individually
  or all at once. The device you are using is shown but cannot sign itself
  out.


  The diagnostics page gained sections describing what is actually running —
  server entry point, package versions, the effective user the container runs
  as — and the security posture that is in force, including the response
  headers and the sign-in rate limits.


  Internally the container no longer starts as root at any point. Earlier
  versions briefly ran privileged to correct file ownership; that step is gone
  now that the app already runs as the right user.


  Updates in place; no reinstall needed.


