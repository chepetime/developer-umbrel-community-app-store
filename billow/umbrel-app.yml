manifestVersion: 1
id: billow
name: Billow
tagline: A self-hosted app with the boring parts already built
icon: https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/billow/icon.svg
category: Development
version: "0.1.43"
port: 46247
description: >-
  A base setup for self-hosted apps. The parts every such app needs are already
  built and tested: accounts with email or username sign-in, TOTP two-factor,
  personal API keys, admin roles, database migrations applied on start, backup
  and restore, file uploads, health checks and an error log.


  Built with Next.js App Router and React Server Components, Prisma on
  PostgreSQL, better-auth, Tailwind and shadcn/ui, shipped as a single
  multi-architecture Docker image.


  It comes with a small invoicing workspace. That is a worked example of the
  platform rather than the point - a real domain wired through the same auth,
  validation, backup and API conventions, there to be replaced by your own.

