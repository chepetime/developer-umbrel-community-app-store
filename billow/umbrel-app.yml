releaseNotes: >-
  A small release. One fix you may notice, and a lot of work underneath that
  you will not.

  Form errors are now announced by screen readers. When a field was rejected
  - a name left blank, a password that did not match - the message appeared
  on screen but was attached to the wrapper around the field rather than the
  field itself, so a screen reader never read it out. Every form in Billow
  was affected.

  Everything else is internal: the linter and formatter were replaced with a
  much faster one, the TypeScript compiler was upgraded, the release checks
  were made harder to break by surprise, and dependencies were refreshed.
  No behaviour changes and no new settings.

  Updates in place; no reinstall needed.


