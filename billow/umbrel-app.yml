releaseNotes: >-
  A security release, from two independent reviews of the whole application.
  Nothing here changes how Billow looks or how you use it.

  Bank account details could be stored unencrypted. Adding an account, and
  restoring a backup, both wrote the account number, IBAN, CLABE, SWIFT and
  routing number in the clear, even though the same fields were encrypted
  when saved during setup. Encrypted columns are now encrypted on every path
  that writes them, and a write that would store one in the clear is now
  refused outright rather than quietly allowed. Existing rows were already
  being sealed at your next sign in, and still are.

  Password reset links could be pointed somewhere else. Billow worked out
  which address to put in the email from the request that asked for it, so a
  crafted request could send a real reset link to an address the attacker
  controlled. If you have set a Public URL under Settings, or the
  BILLOW_TRUSTED_ORIGINS variable, links that do not match are now rejected.
  Setting a Public URL is worth doing, and it is the fix.

  Deleting your account left your uploaded files on disk. The files are now
  removed with the account.

  Recorded errors could contain an email address or a file path. Everything
  attached to an error is now stripped by default rather than only the parts
  someone remembered to strip.

  Also: the rate limiter now holds when many requests arrive at once rather
  than only one at a time, ownership of a new installation can no longer be
  taken twice, the dashboard no longer loads every invoice you have ever
  written to add up four numbers, and the storage figures on the diagnostics
  page now count files stored in per-account folders instead of reporting
  almost nothing.

  Updates in place; no reinstall needed. This release adds a database
  migration, applied automatically on start.


