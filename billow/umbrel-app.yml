releaseNotes: >-
  Adds an experimental data vault under Settings - Vault lab. It stores a
  single private note encrypted with a key only you know, so the note is
  unreadable in a database backup or dump without that key. Lose the key and
  the note is gone - there is no recovery yet, which is why this is labelled
  an experiment rather than somewhere to keep anything you need.


  Important: Billow is served over plain HTTP by default, so your vault key
  travels across your local network unencrypted every time you save or unlock.
  The page now warns you when the connection is insecure. Put Billow behind
  HTTPS before trusting it with anything real.


  Nothing else changes, and the vault is entirely opt-in.


  Updates in place; no reinstall needed.


