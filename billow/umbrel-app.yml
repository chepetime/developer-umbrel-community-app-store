releaseNotes: >-
  The container now runs as uid 1000, matching the user Umbrel creates app data
  with. Uploads previously needed the container to start as root and fix
  ownership on every boot; that step is still there and will migrate an
  existing uploads directory automatically, but it is no longer the only thing
  making uploads work.


  Startup is also logged in detail now — the effective user, the uploads
  directory's ownership before and after, and migration progress — so a
  permission problem says so instead of surfacing later as a failed upload.


  Updates in place; no reinstall needed.


