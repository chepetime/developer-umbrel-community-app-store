version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: billow_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/chepetime/billow:v0.1.18
    init: true
    depends_on:
      - db
    environment:
      # Use the fully-qualified container name (<app-id>_<service>_1), not the
      # bare service name: every Umbrel app shares umbrel_main_network, so a
      # generic alias like "db" also resolves to other apps' Postgres
      # containers (Docmost ships one too) and intermittently fails with
      # "credentials for `billow` are not valid".
      DATABASE_URL: postgresql://billow:billow-password@billow_db_1:5432/billow?schema=public
      # BetterAuth session secret. APP_SEED is Umbrel's per-install
      # deterministic secret (>=32 chars); without it the app throws at
      # startup. No base URL is pinned: the app trusts the request origin, so
      # sign-in works via umbrel.local / Tailscale / Cloudflare / IP.
      BETTER_AUTH_SECRET: ${APP_SEED}
    restart: on-failure

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billow
      POSTGRES_USER: billow
      POSTGRES_PASSWORD: billow-password
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    restart: on-failure
