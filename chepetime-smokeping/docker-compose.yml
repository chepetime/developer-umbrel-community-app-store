version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: chepetime-smokeping_server_1
      APP_PORT: 80

  server:
    # Multi-arch index digest (amd64, arm64).
    image: linuxserver/smokeping:2.9.0@sha256:0c8b547eda8812e16f9888eccd0e08af211431f16e7e0d4d233cb699e8883394
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      # Edit Targets here to choose what gets pinged. The default file only
      # probes localhost, so the graphs stay empty until you add hosts.
      - ${APP_DATA_DIR}/config:/config
      # RRD files: the entire measurement history. Losing this loses every
      # graph, and the point of SmokePing is the long baseline.
      - ${APP_DATA_DIR}/data:/data
      - /etc/localtime:/etc/localtime:ro
    restart: on-failure
