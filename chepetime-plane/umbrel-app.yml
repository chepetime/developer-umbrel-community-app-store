description: >-
  Plane is an open-source project management tool: issues, cycles (sprints),
  modules (epics), custom views and workspace-level analytics, with a public
  read-only "Space" surface for sharing views outside the workspace and a
  "god-mode" instance-admin panel for configuring the install itself.


  This packages upstream's official self-host stack exactly —
  thirteen containers: the web app, the public Space app, the god-mode admin
  panel, the realtime/WebSocket service, the API and three background
  workers (worker, beat-worker, a one-shot migrator), PostgreSQL, Valkey
  (Redis-compatible), RabbitMQ, MinIO for file storage, and a Caddy proxy
  that fronts all of it behind one origin. It is by far the heaviest app in
  this store — make sure the box has the memory for it before installing.


  Attachments and avatars are stored in the bundled MinIO, not on the
  container filesystem, so they survive updates. If you'd rather use an
  external S3-compatible bucket instead, the compose file documents how to
  swap it.


  No email is configured out of the box. The first account is created
  through the normal sign-up form with an email and password — no
  verification email required — after which you can promote it to instance
  admin. Email-dependent features (workspace invites, notifications) need
  SMTP added afterwards through the god-mode panel; until then those actions
  will fail silently rather than send anything. The README beside this app
  has the exact commands.


  Licensed under AGPL-3.0: self-hosting and even commercial hosting are both
  explicitly permitted, the only obligation is making source available to
  users of the service. The images used here are upstream's own
  community-edition builds — no feature is gated behind a separate license
  key.
