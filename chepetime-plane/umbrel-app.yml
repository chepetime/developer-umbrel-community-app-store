releaseNotes: >-
  First packaging of Plane 1.4.1 for this store.

  Thirteen containers, transcribed from upstream's own official self-host
  docker-compose (the same file their install script downloads), converted
  from Swarm-style deploy blocks to this store's usual restart: on-failure,
  with every state directory bind-mounted under app-data instead of
  Docker-managed named volumes, and every cross-service hostname
  fully-qualified since every Umbrel app shares one network.

  Caddy's proxy container already unifies web, space, god-mode, the realtime
  WebSocket and the API behind one origin, so — unlike Multica — no extra
  gateway container was needed here; app_proxy points straight at it.

  Caddy's trusted_proxies is explicitly scoped to Umbrel's internal network
  instead of upstream's own compose, which leaves it at the
  trust-every-peer default because TRUSTED_PROXIES is defined in their
  variables.env but never actually wired into any service.

  MinIO is pinned to the last release upstream published to Docker Hub
  before moving off it toward their commercial product — still the right
  choice for a home Umbrel because it's confirmed multi-arch (amd64+arm64),
  unlike the newer security-hotfixed build available only on quay.io, which
  is amd64-only.

  WEB_URL and CORS_ALLOWED_ORIGINS are deliberately left unset in the
  compose file — same reasoning as Multica's FRONTEND_ORIGIN — and read
  instead from an optional app-data/chepetime-plane/secrets.env. Unset, the
  app still works over whatever origin the browser used; only absolute-URL
  email links need it set.
