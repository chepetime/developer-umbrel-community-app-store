manifestVersion: 1
id: chepetime-threadfin
storage:
  dataRoot: data
name: Threadfin
tagline: Turn IPTV playlists into a tuner Plex, Jellyfin and Emby understand
icon: https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/chepetime-threadfin/icon.svg
category: media
version: "1.2.37-1"
port: 46254
description: >-
  Threadfin sits between an M3U playlist and your media server and pretends to
  be an HDHomeRun tuner. Plex, Jellyfin and Emby then treat IPTV channels as
  ordinary live TV, with a proper guide.


  You pick which channels from a provider's list you actually want, reorder
  and rename them, map them to XMLTV guide data, and set how many streams may
  run at once. Several playlists and guide sources can be merged into one
  tuner.


  It buffers streams itself, which smooths over providers that stall, and it
  can filter by group so a list of thousands becomes the twenty channels you
  watch.


  Threadfin is the maintained fork of xTeVe, which is no longer developed.
  Bring your own provider — none is included, and nothing works until you add
  an M3U URL in Settings.


  Note: the playlist, guide and tuner endpoints are exempt from Umbrel's login
  so your media server can reach them. Do not expose this app to the internet.
developer: Threadfin
website: https://github.com/Threadfin/Threadfin
submitter: ChepeTime
submission: https://github.com/chepetime/developer-umbrel-community-app-store
repo: https://github.com/Threadfin/Threadfin
support: https://github.com/Threadfin/Threadfin/issues
gallery: []
releaseNotes: >-
  Moves this app's data into the data/ folder of its app directory, which is
  the folder umbrelOS 2.0 storage management can relocate to another drive.
  Existing installs are moved automatically the first time the app starts
  after this update. Nothing is reset or re-downloaded, and on current
  umbrelOS versions nothing else changes.

dependencies: []
