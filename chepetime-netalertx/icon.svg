<!--
  A generic network-watch mark in this store's house style. Deliberately not
  upstream's logo, which is theirs and not ours to redistribute.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NetAlertX">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0b1f2a"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <g clip-path="url(#rounded)">
    <!-- Links from the hub out to the known devices. -->
    <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.45">
      <path d="M256 256 L136 168"/>
      <path d="M256 256 L376 168"/>
      <path d="M256 256 L136 356"/>
    </g>

    <!-- The one unknown device, drawn in the alert colour. -->
    <path d="M256 256 L376 356" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>

    <!-- Hub. -->
    <circle cx="256" cy="256" r="52" fill="#ffffff"/>
    <circle cx="256" cy="256" r="22" fill="#0b1f2a"/>

    <!-- Known devices. -->
    <g fill="#ffffff">
      <circle cx="136" cy="168" r="28"/>
      <circle cx="376" cy="168" r="28"/>
      <circle cx="136" cy="356" r="28"/>
    </g>

    <!-- New device: highlighted, with a ring to read as "just appeared". -->
    <circle cx="376" cy="356" r="34" fill="#fbbf24"/>
    <circle cx="376" cy="356" r="52" fill="none" stroke="#fbbf24" stroke-width="8" opacity="0.5"/>
  </g>
</svg>
