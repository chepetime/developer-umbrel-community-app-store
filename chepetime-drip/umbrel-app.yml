manifestVersion: 1
id: chepetime-drip
storage:
  dataRoot: data
name: Drip
tagline: Track every subscription you pay for
icon: https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/chepetime-drip/icon.svg
category: finance
version: "0.1.4-1"
port: 36249
description: >-
  Drip keeps every subscription you pay for in one place, totals what they
  really cost each month and each year, and shows what renews next, so nothing
  charges you by surprise.


  Add a subscription with its price and one charge date; Drip works out every
  renewal from there, monthly, yearly or every few weeks, including trials and
  month-end dates. The dashboard shows your totals per currency, the next 30
  days of charges, trials about to end and spending by category. Each
  subscription keeps its price history, so creeping increases show.


  It never connects to a bank. Payment-method details are encrypted with your
  password, and everything else stays in the app's own database on your
  server. Import and export CSV, back up and restore, and script it through a
  personal API.


  Reminders arrive a few days before a renewal or the end of a free trial, in
  the app and by email, ntfy, Gotify or webhook, and a private calendar feed
  puts every renewal in your calendar app. Households with shared
  subscriptions and a spending forecast are on the way.

developer: ChepeTime
website: https://github.com/chepetime/umbrel-drip
submitter: ChepeTime
submission: https://github.com/chepetime/developer-umbrel-community-app-store
repo: https://github.com/chepetime/umbrel-drip
support: https://github.com/chepetime/umbrel-drip/issues
# Required, not optional: umbreld's manifest schema declares
# `gallery: z.array(z.string())` with no `.optional()`. Omitting it fails Zod
# validation and umbreld drops the app from the store silently.
gallery:
  - https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/chepetime-drip/gallery/1-home.jpg
  - https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/chepetime-drip/gallery/2-explore.jpg
  - https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/chepetime-drip/gallery/3-reminders.jpg
releaseNotes: >-
  Refreshed the pinned digest for postgres:16-alpine; upstream re-published
  the same tag, so nothing else changed.

dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
