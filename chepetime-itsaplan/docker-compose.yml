version: "3.7"

# It's a Plan, repackaged from upstream's docker-compose.yml
# (github.com/croffasia/itsaplan). Same services, same images; the
# differences are all about living on Umbrel's shared network:
#
#   - a `gateway` nginx in front, so the web app and the api share one origin
#     (upstream's "API_URL as a path on the web's host" layout);
#   - every cross-service hostname fully qualified;
#   - every volume a bind mount under ${APP_DATA_DIR}/data;
#   - secrets derived from APP_SEED / APP_PASSWORD instead of a .env file;
#   - the public address read from env files, so secrets.env can set it.

x-env-files: &env-files
  env_file:
    # Package defaults: APP_URL, API_URL, TRUSTED_PROXIES, TELEMETRY_DISABLED.
    # In hooks/ so that updates refresh it (see AGENTS.md, "Installs Copy
    # Everything, Updates Copy A Whitelist").
    - path: ${APP_DATA_DIR}/hooks/defaults.env
      required: true
    # Per-host overrides, never in this repo, touched by neither installs nor
    # updates. Later env files win, so anything here beats defaults.env. The
    # public https address goes here — see README.md.
    #
    # Nothing that should be overridable may appear under `environment:`
    # below: `environment` beats every env_file, silently.
    - path: ${APP_DATA_DIR}/secrets.env
      required: false

services:
  app_proxy:
    environment:
      APP_HOST: chepetime-itsaplan_gateway_1
      APP_PORT: 80
      # The api authenticates on its own (session cookie, personal API keys,
      # OAuth for MCP). CLI and MCP clients carry no Umbrel session, so /api
      # and the OAuth discovery documents bypass Umbrel's login. The web UI
      # stays behind it.
      PROXY_AUTH_WHITELIST: "/api/*,/.well-known/*"

  gateway:
    image: nginx:1.31-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    depends_on:
      - web
      - api
    volumes:
      # In hooks/ so updates reach it; see the note in hooks/nginx.conf.
      - ${APP_DATA_DIR}/hooks/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
    restart: on-failure

  postgres:
    # 17, as upstream ships. Pre-18, so the mount stays on .../data — do not
    # copy Multica's pg18 parent-directory mount here.
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: itsaplan
      POSTGRES_DB: itsaplan
      # Every Umbrel app shares one Docker network; a committed password would
      # open this database to every other installed app.
      POSTGRES_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsaplan -d itsaplan"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

  # S3-compatible store for issue attachments. Upstream calls this service
  # `minio` for the sake of installs that predate RustFS; a new install has no
  # such history, so it is named for what it is.
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    # As upstream: the data directory is written as root.
    user: "0:0"
    environment:
      RUSTFS_ACCESS_KEY: itsaplan
      RUSTFS_SECRET_KEY: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      default:
        aliases:
          # Hyphen-only, fully-qualified alias for S3_ENDPOINT. Container names
          # carry underscores, which RFC 1123 forbids in a hostname and which
          # S3 SDKs may reject (boto3 does — see Plane in AGENTS.md).
          - chepetime-itsaplan-rustfs
    restart: on-failure

  # One-shot: creates the attachments bucket, then exits. A PUT on an existing
  # bucket succeeds, so it runs on every start.
  rustfs-init:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: itsaplan
      S3_SECRET_ACCESS_KEY: ${APP_PASSWORD}
      S3_BUCKET: planner-attachments
    entrypoint: >
      /bin/sh -c "
      curl -fsS -X PUT --aws-sigv4 aws:amz:us-east-1:s3 --user \"$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY\" http://chepetime-itsaplan-rustfs:9000/\"$$S3_BUCKET\" &&
      echo 'bucket ready: '\"$$S3_BUCKET\"
      "

  # One-shot: dumps the database, applies migrations, exits. api, worker and
  # bot wait for it, so none of them runs against an old schema.
  migrate:
    image: ghcr.io/croffasia/itsaplan-api:1.10.0@sha256:9f53d060db6594b2e51bc224183e8e8c60e544a1fd65dcd451c053568c642753
    restart: "no"
    command: ["bun", "run", "packages/db/src/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://itsaplan:${APP_PASSWORD}@chepetime-itsaplan_postgres_1:5432/itsaplan
    volumes:
      # The dump taken before a release's migrations, kept 30 days.
      - ${APP_DATA_DIR}/data/backups:/backups

  api:
    image: ghcr.io/croffasia/itsaplan-api:1.10.0@sha256:9f53d060db6594b2e51bc224183e8e8c60e544a1fd65dcd451c053568c642753
    # The image's own CMD migrates first; the migrate service has done that.
    command: ["bun", "run", "apps/api/src/index.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
    <<: *env-files
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://itsaplan:${APP_PASSWORD}@chepetime-itsaplan_postgres_1:5432/itsaplan
      # Signs sessions. APP_SEED is Umbrel's per-install secret.
      BETTER_AUTH_SECRET: ${APP_SEED}
      # AES key for provider credentials stored in the database (SHA-256 of
      # this string). A different value from the auth secret, still derived
      # per install. Changing it makes stored credentials unreadable, so the
      # suffix must never change.
      APP_ENCRYPTION_KEY: ${APP_SEED}-encryption
      S3_ENDPOINT: http://chepetime-itsaplan-rustfs:9000
      S3_BUCKET: planner-attachments
      S3_ACCESS_KEY_ID: itsaplan
      S3_SECRET_ACCESS_KEY: ${APP_PASSWORD}
      S3_REGION: us-east-1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

  # Webhook and notification delivery, agent schedules and agent runs.
  worker:
    image: ghcr.io/croffasia/itsaplan-worker:1.10.0@sha256:840650f1dc8cec4d82cf8cdc6fa5cd43aa82df1fc9a9f9213358e3c33688aed0
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    <<: *env-files
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://itsaplan:${APP_PASSWORD}@chepetime-itsaplan_postgres_1:5432/itsaplan
      APP_ENCRYPTION_KEY: ${APP_SEED}-encryption
      S3_ENDPOINT: http://chepetime-itsaplan-rustfs:9000
      S3_BUCKET: planner-attachments
      S3_ACCESS_KEY_ID: itsaplan
      S3_SECRET_ACCESS_KEY: ${APP_PASSWORD}
      S3_REGION: us-east-1
    restart: on-failure

  # Telegram bot (long polling). Idle until a bot token is saved in god mode.
  # Must stay at one replica.
  bot:
    image: ghcr.io/croffasia/itsaplan-bot:1.10.0@sha256:d0ab66c7454d003064ea455299db740746f6c6a53edcb375429881c88aad5780
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    <<: *env-files
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://itsaplan:${APP_PASSWORD}@chepetime-itsaplan_postgres_1:5432/itsaplan
      APP_ENCRYPTION_KEY: ${APP_SEED}-encryption
    restart: on-failure

  web:
    image: ghcr.io/croffasia/itsaplan-web:1.10.0@sha256:be213d6861f66ac68320db2a1481c050bc811a740d558f5ebde576b34f78b289
    depends_on:
      - api
    <<: *env-files
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      # Where the web server itself reaches the api (it streams avatars and
      # attachments from there). Upstream's `http://api:3000` would resolve to
      # whichever app on the shared network answers to `api`.
      SERVICE_URL_API: http://chepetime-itsaplan_api_1:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
