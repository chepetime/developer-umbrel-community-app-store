# Gateway: one origin for It's a Plan's web app and api.
#
# Upstream supports the api either on its own subdomain or on a path of the
# web's host (docs/self-hosting.md, "Where the api lives"). app_proxy forwards
# to a single APP_HOST, and a Cloudflare Tunnel hostname is one origin too, so
# this package uses the path layout:
#
#   /api/*                         -> api:3000/*   (prefix removed)
#   /.well-known/oauth-* and
#   /.well-known/openid-configuration* -> api:3000 (MCP OAuth discovery)
#   everything else                -> web:3001
#
# API_URL must therefore be APP_URL + "/api" (hooks/defaults.env, secrets.env).
#
# Lives in hooks/ because an app *update* copies only a whitelist that
# includes hooks/ — a file beside the manifest would freeze at whatever the
# first install wrote. Nothing executes it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Targets are held in variables so they are
    # re-resolved per request, not once at startup — a recreated container
    # otherwise leaves nginx on a dead IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upload limits are the api's own (god mode settings); nginx should not
    # reject a body first with a 413.
    client_max_body_size 0;

    # Fully qualified: every Umbrel app shares one network, so a bare `api` or
    # `web` resolves to whichever app answers to it.
    set $itsaplan_api "chepetime-itsaplan_api_1:3000";
    set $itsaplan_web "chepetime-itsaplan_web_1:3001";

    proxy_http_version 1.1;

    # Every location repeats the full proxy_set_header list. nginx inherits
    # proxy_set_header from the server block only into a location that sets
    # none of its own, so one Upgrade header in a location silently drops
    # X-Forwarded-For and Host there. That happened in the first cut of this
    # file: the api saw no client address at all.
    #
    # X-Forwarded-For is appended, not replaced: the api skips 10.21.0.0/16
    # (TRUSTED_PROXIES in defaults.env) from the right of the chain, which
    # drops app_proxy or the cloudflared connector and leaves the real client
    # for the sign-in rate limit.

    location /api/ {
        # Strip /api from the raw request URI. $request_uri is not
        # percent-decoded, unlike a rewrite capture, so encoded slashes and
        # the query string reach the api untouched.
        set $api_uri "/";
        if ($request_uri ~ "^/api(/.*)$") {
            set $api_uri $1;
        }
        proxy_pass http://$itsaplan_api$api_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Agent chat and run logs stream as server-sent events.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300;
    }

    location = /api {
        return 308 /api/;
    }

    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration) {
        proxy_pass http://$itsaplan_api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$itsaplan_web$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Next.js streams App Router responses.
        proxy_buffering off;
        proxy_read_timeout 300;
    }
}
