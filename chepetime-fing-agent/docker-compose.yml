version: "3.7"

# No app_proxy service here, deliberately.
#
# The proxy can only reach a container on umbrel_main_network, and this one
# runs on the host's network stack instead. Home Assistant, the reference
# host-network app in getumbrel/umbrel-apps, omits it for the same reason:
# Umbrel then links straight to <host>:<port> from umbrel-app.yml. Adding an
# app_proxy block back would leave the app unreachable behind a proxy pointed
# at a container that has no address of its own.
services:
  server:
    # Pinned by digest as well as tag, matching every other app in this store.
    # This is the multi-arch index digest covering linux/amd64 and linux/arm64,
    # so both Umbrel Home and Raspberry Pi installs resolve from one pin.
    # `latest` and `1.1.1` are currently the same image; the version tag is
    # used so an upstream re-push of `latest` cannot silently change installs.
    image: fing/fing-agent:1.1.1@sha256:19dad245d2a5216e958d6616c973818aa373e394335936a05925d81c2a9e3959
    # Required by Fing. The agent discovers devices by watching and probing the
    # LAN directly, which a bridged container cannot do — it would only ever
    # see Docker's own subnet and report an empty network.
    network_mode: host
    # Needed for the ARP-level scanning the agent performs. Note this is a real
    # privilege grant on the host network stack, narrower than the `privileged:
    # true` that Home Assistant uses but still worth knowing about.
    cap_add:
      - NET_ADMIN
    volumes:
      # Agent identity, activation state and collected history. The container
      # filesystem is replaced on every update, so losing this would unpair the
      # agent from the Fing account and start discovery over from nothing.
      - ${APP_DATA_DIR}/fingdata:/app/fingdata
    restart: on-failure
