manifestVersion: 1
id: chepetime-fing-agent
name: Fing Agent
tagline: Always-on network monitoring, device discovery and security audits
icon: https://raw.githubusercontent.com/chepetime/developer-umbrel-community-app-store/master/chepetime-fing-agent/icon.svg
category: networking
version: "1.1.1"
# Not a web UI. The agent publishes its status over UPnP on this port and, on
# paid Fing plans, serves the local API here. Umbrel requires a port and links
# "Open" to it, so opening the app shows that endpoint rather than a dashboard
# — the agent is driven entirely from the Fing mobile app.
port: 44444
description: >-
  Turns this Umbrel into an always-on network monitor. The Fing Agent watches
  your LAN continuously and reports every device on it, so you see what joins
  and leaves in real time rather than only when you happen to run a scan.


  It gives you a full inventory of connected devices, automated security
  audits, a timeline of network events, and push alerts when something new
  appears or a known device goes offline. Paid Fing plans add a local API,
  device blocking and internet-usage controls.


  The agent runs on the host network with NET_ADMIN so it can see the real LAN
  — a bridged container would only ever see Docker's own subnet.


  Note that this app has no web interface of its own. Everything is set up and
  viewed in the Fing mobile app, which must be on the same network to find and
  activate the agent, and a free Fing account is required. See this app's
  README for the activation steps.
developer: Fing
website: https://www.fing.com/agent/
submitter: ChepeTime
submission: https://github.com/chepetime/developer-umbrel-community-app-store
repo: ""
support: https://help.fing.com/
# Required, not optional: umbreld's manifest schema declares
# `gallery: z.array(z.string())` with no `.optional()`, unlike every other
# field that can be left out. Omitting it fails Zod validation and umbreld
# drops the app from the store silently — no error, the app simply never
# appears. An empty array validates, which is what is used here: Fing's own
# screenshots are their assets, not ours to republish, and this app has no
# interface of its own to capture.
gallery: []
releaseNotes: >-
  First packaging of Fing Agent 1.1.1 for this store.

  Runs with host networking and NET_ADMIN, as Fing requires for LAN discovery,
  and keeps agent state in ${APP_DATA_DIR}/fingdata so activation survives
  updates.

  Activation happens in the Fing mobile app on the same network; nothing is
  configured from Umbrel itself.

dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
