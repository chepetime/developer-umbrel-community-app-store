<!--
  A generic radar/scan mark in this store's house style. Deliberately not
  Fing's logo, which is their trademark and not ours to redistribute.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fing Agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0b1736"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <g clip-path="url(#rounded)">
    <!-- Radar rings, fading outward so the centre reads as the agent itself. -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <circle cx="256" cy="256" r="60" stroke-width="14" opacity="0.85"/>
      <circle cx="256" cy="256" r="118" stroke-width="12" opacity="0.5"/>
      <circle cx="256" cy="256" r="176" stroke-width="10" opacity="0.25"/>
    </g>

    <!-- Sweep wedge, the moving part of a scan frozen in place. -->
    <path d="M256 256 L256 62 A194 194 0 0 1 393 119 Z" fill="#ffffff" opacity="0.16"/>

    <!-- Discovered devices sitting on the rings. -->
    <g fill="#ffffff">
      <circle cx="256" cy="256" r="26"/>
      <circle cx="374" cy="256" r="20"/>
      <circle cx="173" cy="339" r="18"/>
      <circle cx="196" cy="173" r="16"/>
    </g>
    <circle cx="256" cy="80" r="20" fill="#38bdf8"/>
  </g>
</svg>
