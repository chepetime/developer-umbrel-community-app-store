gallery: []
releaseNotes: >-
  First packaging of MiroTalk P2P 1.9.15 for this store.

  Chosen over Jitsi because peer-to-peer media needs no forwarded UDP port and
  so survives being fronted by a Cloudflare Tunnel.

  Upstream's phone-home defaults are off: no usage analytics, no exit survey,
  no IP geolocation. The REST API is disabled, because its default key is
  published in upstream's env template.

  Rooms are open to anyone with the link. Read the README before exposing this
  outside the LAN — host protection and TURN both go in secrets.env.

  Stateless — there is nothing to back up.

